<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecno Tech Oberá</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#0f172a;--accent:#25D366;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial}
body{background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
header{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:50}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.03);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#f1f5f9}
.card .precio{font-weight:800;color:#0a7d32;margin:8px 0}
.card button{background:var(--primary);color:#fff;border:none;padding:8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header><div style="font-weight:800">Tecno Tech <span style="color:#25D366">Oberá</span></div><button id="btn-carrito">Carrito (<span id="contador">0</span>)</button></header>
<main style="padding:20px;max-width:1200px;margin:auto;width:100%"><div id="grid" class="grid"></div></main>
<script>
// ESTA ES LA CLAVE: ahora tus fotos están en /img/
const PRODUCTOS = [
  {id:"p200",nombre:"Termo Stanley 1L Rosa System",precio:38900,imagenes:["img/final_prod_001.jpg"]},
  {id:"p201",nombre:"Termo Stanley 1L Rojo",precio:38900,imagenes:["img/final_prod_002.jpg"]},
  {id:"p202",nombre:"Termo Stanley 1L Blanco",precio:38900,imagenes:["img/final_prod_003.jpg"]},
  {id:"p203",nombre:"Termo Stanley 1L Bordo",precio:38900,imagenes:["img/final_prod_004.jpg"]},
  {id:"p204",nombre:"Termo Stanley 1L Lila",precio:38900,imagenes:["img/final_prod_005.jpg"]},
  {id:"p205",nombre:"Vaso Quencher 1.2L Stanley Degradé",precio:43200,imagenes:["img/final_prod_010.jpg"]},
  {id:"p206",nombre:"Vaso Quencher 1.2L Stanley Rosa/Lila",precio:43200,imagenes:["img/final_prod_011.jpg"]},
  {id:"p207",nombre:"Kit GOAT 4x1 Stanley Rosa",precio:24500,imagenes:["img/final_prod_015.jpg"]},
  {id:"p208",nombre:"Set Tramontina New Kolor 25 piezas",precio:28900,imagenes:["img/final_prod_020.jpg"]},
  {id:"p176",nombre:"PC Gamer i3 + GTX 750 Ti Completa",precio:480000,imagenes:["img/p176-1.jpg"]},
];

const grid=document.getElementById("grid");
const fmt=n=>n.toLocaleString("es-AR");
PRODUCTOS.forEach(p=>{
  const div=document.createElement("div");div.className="card";
  div.innerHTML=`<img src="${p.imagenes[0]}" onerror="this.src='https://placehold.co/400?text=${encodeURIComponent(p.nombre)}'"><h3 style="font-size:.9rem;margin-top:8px">${p.nombre}</h3><div class="precio">$${fmt(p.precio)}</div><button onclick="alert('Agregado: ${p.nombre}')">Añadir</button>`;
  grid.appendChild(div);
});
</script>
</body>
</html>
